name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Fast host-Python job: type check + unit tests without Docker build overhead.
  # Format and lint run exclusively in docker-validate, which uses the same ruff
  # version as the published image and is the canonical linting environment.
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-asyncio mypy

      - name: Type check
        run: python -m mypy server.py

      - name: Test
        run: python -m pytest tests/ -v

  # Docker job: validates format, lint, type check, and tests inside the container.
  # This is the canonical environment — it uses the same tool versions as the published image.
  docker-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build dev image
        run: docker compose -f dev/docker-compose.yml build

      - name: Prepare workspace for container user
        run: sudo chown -R 1000:1000 .

      - name: Validate inside container
        run: |
          docker compose -f dev/docker-compose.yml run --rm --entrypoint "" my-app sh -c \
            "cd /workspace && \
             python -m ruff format --check server.py && \
             python -m ruff check server.py && \
             python -m mypy server.py && \
             python -m pytest tests/ -v"
