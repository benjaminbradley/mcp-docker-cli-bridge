# Bridge development compose file — for developing and testing the bridge itself.
# Consumer projects do not use this file; see the Quick Start in README.md.

services:
  my-app:
    build:
      context: ..       # project root — Dockerfile lives there
      target: dev
      args:
        # Supply-chain cooldown for pip. Sourced from Makefile (which exports it)
        # or the shell env; defaults to P3D if unset. See doc/SECURITY.md.
        PIP_UPLOADED_PRIOR_TO: ${PIP_UPLOADED_PRIOR_TO:-P3D}
    entrypoint: ["python", "/workspace/server.py"]
    volumes:
      - ./commands.dev.json:/bridge/commands.json:ro
      - ../data/bridge-logs:/bridge/logs
      - ..:/workspace
    environment:
      - BRIDGE_PORT=7357
      - BRIDGE_HOST=0.0.0.0
      - BRIDGE_COMMANDS_FILE=/bridge/commands.json
      - BRIDGE_LOG_DIR=/bridge/logs
      - PYTHONPATH=/workspace
    networks:
        - bridge-dev
networks:
  bridge-dev:
    name: bridge-dev
    ipam:
      config:
        - subnet: 172.21.0.0/24
